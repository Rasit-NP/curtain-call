# CI: PR과 main push마다 scripts/verify.sh를 실행한다(루트 CLAUDE.md 'CI').
#
# - 검증은 verify.sh 하나로 한다(결정 0001). 이 파일에는 도구 설치, 캐시, 결과 정리만 둔다.
#   검증 명령(gradlew, npm run, playwright test 등)을 직접 부르지 않는다.
# - 범위(결정 0190): main push는 늘 전체다. PR은 바꾼 파일이 모두 docs/ 아래면 하네스만, 아니면 전체다(scripts/ci-scope.sh).
#   어느 쪽이든 이 잡(verify)이 결과를 남기므로, 필수 검사로 걸어도 '대기'로 남지 않는다.
# - 보안(결정 0191): GitHub 공식 actions/*만 커밋 SHA로 고정해 쓰고 버전은 주석에 적는다. 토큰 권한은 contents: read이고,
#   checkout은 토큰을 git 설정에 남기지 않는다(검증 중에 도는 의존성 설치 스크립트가 읽지 못하게).
# - 위 규칙은 하네스(scripts/harness.test.sh)가 검사한다. 구성의 근거는 결정 0193에 있다.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # 같은 PR에 새 커밋을 올리면 이전 실행을 취소한다. main push는 커밋마다 따로 돌고 서로 취소하지 않는다.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # shell을 적으면 bash가 -eo pipefail로 돈다. 출력을 tee로 남겨도 verify.sh의 종료 코드가 단계 결과가 된다.
    shell: bash

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR은 병합 커밋을 받는다. 첫 부모(PR의 대상 브랜치)와 비교해 바뀐 파일을 보려고 부모까지 받는다.
          fetch-depth: 2
          persist-credentials: false

      - name: 검증 범위
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            mode="$(bash scripts/ci-scope.sh HEAD^1 HEAD)"
          else
            mode=all
          fi
          echo "검증 범위: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Java 21과 Gradle 캐시
        if: steps.scope.outputs.mode == 'all'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Node.js(.nvmrc)와 npm 캐시
        if: steps.scope.outputs.mode == 'all'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Playwright 브라우저 캐시
        if: steps.scope.outputs.mode == 'all'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # 브라우저 판은 Playwright 판이 정하고, Playwright 판은 e2e의 lockfile에 있다.
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: verify.sh
        id: verify
        # 멈춘 실행을 끊는다(캐시 없는 실행이 4분 안팎, 약 4배 여유). 잡의 시간 제한보다 짧게 두어 요약과 산출물 단계가 돈다.
        timeout-minutes: 15
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: ./scripts/verify.sh "$MODE" 2>&1 | tee "$RUNNER_TEMP/verify.out"

      - name: 검증 요약을 실행 화면에
        if: always() && steps.verify.outcome != 'skipped'
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          out="$RUNNER_TEMP/verify.out"
          {
            echo "## verify.sh $MODE: $OUTCOME"
            echo
            if [ "$MODE" = harness ]; then
              echo "PR이 바꾼 파일이 모두 docs/ 아래라 하네스만 실행했다(결정 0190)."
              echo
            fi
            # verify.sh 출력의 '검증 요약'부터 끝까지(실패 상세 포함). 그 줄이 없으면(시간 제한, 취소) 출력 끝부분.
            summary="$(sed -n '/^===== 검증 요약/,$p' "$out" 2>/dev/null || true)"
            if [ -z "$summary" ]; then
              echo "'검증 요약' 전에 끝났다. 출력 마지막 60줄:"
              echo
              summary="$(tail -n 60 "$out" 2>/dev/null || true)"
            fi
            echo '~~~~~~~~text'
            printf '%s\n' "$summary"
            echo '~~~~~~~~'
            if [ "$OUTCOME" = failure ]; then
              echo
              echo "로그와 리포트는 산출물 verify-failure-${GITHUB_RUN_ATTEMPT}에 있다(7일 보관). 받기: \`gh run download ${GITHUB_RUN_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 산출물 올리기
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-failure-${{ github.run_attempt }}
          # .verify-logs/는 이름이 점으로 시작해, 이 옵션이 없으면 빠진다.
          include-hidden-files: true
          path: |
            .verify-logs/
            backend/build/reports/
            backend/build/test-results/
            frontend/coverage/
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
