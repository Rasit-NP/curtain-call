plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.curtaincall'
version = '0.0.1-SNAPSHOT'

// 기본 java가 25여도 컴파일·테스트·bootRun은 21로 한다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// E2E용 백엔드 실행기(src/e2eRun, 결정 0162): 운영 애플리케이션에 실행마다 새 PostgreSQL 컨테이너를 붙여 e2e 프로필로 띄운다.
// 테스트 소스와 나눈다. 테스트 클래스(@TestConfiguration, 시험용 컨트롤러)가 클래스패스에 있으면 컴포넌트 스캔에 걸려 E2E 서버에 들어간다.
sourceSets {
    e2eRun {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eRunImplementation.extendsFrom implementation
    e2eRunRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    e2eRunImplementation 'org.springframework.boot:spring-boot-testcontainers'
    e2eRunImplementation 'org.testcontainers:testcontainers-postgresql'
}

// E2E용 백엔드를 띄운다(e2e/playwright.config.ts가 부른다). 포트 등은 --args로 받는다.
// 예: ./gradlew bootE2eRun --args='--server.address=127.0.0.1 --server.port=18080'
tasks.register('bootE2eRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    description = 'E2E용 백엔드를 e2e 프로필로 띄운다. DB는 실행마다 새로 만드는 PostgreSQL 컨테이너다(Testcontainers).'
    group = 'application'
    classpath = sourceSets.e2eRun.runtimeClasspath
    mainClass = 'com.curtaincall.e2e.E2eApplication'
}

// 단위 테스트를 컴파일할 때 E2E 실행기도 컴파일한다. 운영 코드가 바뀌어 실행기가 깨지면 quick 검증에서 바로 드러난다.
tasks.named('testClasses') {
    dependsOn tasks.named('e2eRunClasses')
}

// 단위 테스트: integration 태그를 뺀다.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // ErrorCodeTest가 루트 CLAUDE.md의 오류 코드 표를 읽는다. 표만 바뀌어도 UP-TO-DATE로 건너뛰지 않게 입력으로 둔다.
    inputs.file('../CLAUDE.md')
            .withPropertyName('errorCodeTable')
            .withPathSensitivity(PathSensitivity.NONE)
}

// 통합 테스트: integration 태그만 실행한다. Docker가 필요하다.
def integrationTest = tasks.register('integrationTest', Test) {
    description = 'integration 태그가 붙은 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn integrationTest
}

// 커버리지 리포트는 단위·통합 테스트 결과를 합쳐서 만든다.
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), integrationTest
    executionData tasks.named('test').get(), integrationTest.get()
    reports {
        xml.required = true
        html.required = true
    }
}
