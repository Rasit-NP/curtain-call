plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.curtaincall'
version = '0.0.1-SNAPSHOT'

// 기본 java가 25여도 컴파일·테스트·bootRun은 21로 한다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// E2E용 백엔드 실행기(src/e2eRun, 결정 0162): 운영 애플리케이션에 실행마다 새 PostgreSQL 컨테이너를 붙여 e2e 프로필로 띄운다.
// 테스트 소스와 나눈다. 테스트 클래스(@TestConfiguration, 시험용 컨트롤러)가 클래스패스에 있으면 컴포넌트 스캔에 걸려 E2E 서버에 들어간다.
sourceSets {
    e2eRun {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eRunImplementation.extendsFrom implementation
    e2eRunRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    e2eRunImplementation 'org.springframework.boot:spring-boot-testcontainers'
    e2eRunImplementation 'org.testcontainers:testcontainers-postgresql'
}

// E2E용 백엔드를 띄운다(e2e/playwright.config.ts가 부른다). 포트 등은 --args로 받는다.
// 예: ./gradlew bootE2eRun --args='--server.address=127.0.0.1 --server.port=18080'
tasks.register('bootE2eRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    description = 'E2E용 백엔드를 e2e 프로필로 띄운다. DB는 실행마다 새로 만드는 PostgreSQL 컨테이너다(Testcontainers).'
    group = 'application'
    classpath = sourceSets.e2eRun.runtimeClasspath
    mainClass = 'com.curtaincall.e2e.E2eApplication'
}

// 단위 테스트를 컴파일할 때 E2E 실행기도 컴파일한다. 운영 코드가 바뀌어 실행기가 깨지면 quick 검증에서 바로 드러난다.
tasks.named('testClasses') {
    dependsOn tasks.named('e2eRunClasses')
}

// 단위 테스트: integration 태그를 뺀다.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // ErrorCodeTest가 루트 CLAUDE.md의 오류 코드 표를 읽는다. 표만 바뀌어도 UP-TO-DATE로 건너뛰지 않게 입력으로 둔다.
    inputs.file('../CLAUDE.md')
            .withPropertyName('errorCodeTable')
            .withPathSensitivity(PathSensitivity.NONE)
}

// 통합 테스트: integration 태그만 실행한다. Docker가 필요하다.
def integrationTest = tasks.register('integrationTest', Test) {
    description = 'integration 태그가 붙은 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn integrationTest
}

// 커버리지 리포트는 단위·통합 테스트 결과를 합쳐서 만든다.
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), integrationTest
    executionData tasks.named('test').get(), integrationTest.get()
    reports {
        xml.required = true
        html.required = true
    }
}

// 뮤테이션 테스트(PIT): 규칙 코드(R1~R6)의 변이를 테스트가 잡는지 잰다(Issue #69, 결정 0200).
// ./gradlew pitest → build/reports/pitest/index.html, mutations.xml. 단위·통합 테스트를 모두 쓴다(서비스는 통합 테스트로만 덮여 있다). Docker가 필요하다.
// 7단계에서 같은 설정으로 다시 잰다. 대상·연산자·스레드를 바꾸면 점수를 그대로 비교할 수 없으므로 결정 기록을 새로 남긴다.
pitest {
    pitestVersion = '1.30.2'
    junit5PluginVersion = '1.2.3'
    // 규칙을 판정하거나 규칙의 오류 코드를 내는 클래스만 잰다. 고른 근거와 뺀 클래스는 docs/decisions/0201-pit-target-classes.md에 있다.
    targetClasses = [
            // R1·R2·R3: 선점, 한도, 지연 만료, 좌석 상태
            'com.curtaincall.hold.application.HoldService',
            'com.curtaincall.hold.domain.Hold',
            'com.curtaincall.hold.domain.HoldLimit',
            'com.curtaincall.hold.domain.SeatAvailability',
            'com.curtaincall.hold.domain.HoldRepository',
            'com.curtaincall.performance.domain.Seat',
            // R2·R4·R5: 결제, 예매, 멱등 키
            'com.curtaincall.payment.application.PaymentService',
            'com.curtaincall.payment.domain.IdempotencyRecord',
            'com.curtaincall.payment.api.IdempotencyKeyHeader',
            'com.curtaincall.payment.api.StoredPaymentResponses',
            'com.curtaincall.reservation.domain.Reservation',
            // R6: 토큰 검증, 인증이 필요한 경로, 401 AUTH_REQUIRED
            'com.curtaincall.auth.api.CurrentUserIds',
            'com.curtaincall.auth.infra.AuthRequiredEntryPoint',
            'com.curtaincall.auth.infra.JwtConfig',
            'com.curtaincall.auth.infra.SecurityConfig',
    ]
    targetTests = ['com.curtaincall.*']
    mutators = ['STRONGER']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    enableDefaultIncrementalAnalysis = false
    // 점수(죽인 변이 / 전체 변이)가 이 값보다 낮으면 실패한다(결정 0203). 보강 후 재측정 점수 93.3%(195/209)의 소수점 버림이다.
    // PIT는 점수를 정수로 반올림해 비교한다(HALF_UP). 변이 209개에서는 새로 살아남은 변이가 2개 이상이면 실패한다.
    mutationThreshold = 93
    // 작업자(minion) JVM도 Java 21 툴체인으로 띄운다. 지정하지 않으면 PIT 주 프로세스의 java를 쓴다.
    jvmPath = javaToolchains.launcherFor(java.toolchain).map { it.executablePath }
}
