# 공통 설정. 프로필을 주지 않으면 local로 뜬다.
spring:
  application:
    name: curtain-call
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # 스키마 마이그레이션만 쓴다. 시드는 local·e2e에서만 더한다.
    locations: classpath:db/migration

---
# local: 로컬 개발, e2e: local과 같고 E2E 지원 엔드포인트가 켜진다.
# 루트 compose.yaml의 db 서비스에 붙는다. 접속 정보는 개발 전용 값이다(실제 비밀번호가 아님).
spring:
  config:
    activate:
      on-profile: local | e2e
  datasource:
    url: jdbc:postgresql://localhost:5432/curtaincall
    username: curtaincall
    password: curtaincall-dev
  flyway:
    locations: classpath:db/migration, classpath:db/seed

---
# test: 통합 테스트. DB는 Testcontainers가 @ServiceConnection으로 연결하고, 시드를 넣지 않는다.
spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration

---
# prod: 배포용. DB 접속 정보는 환경변수로만 받는다(이름은 루트 .env.example). 기본값을 두지 않는다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
