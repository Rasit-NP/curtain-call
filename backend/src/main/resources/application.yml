# 공통 설정. 프로필을 주지 않으면 local로 뜬다.
spring:
  application:
    name: curtain-call
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # 스키마 마이그레이션만 쓴다. 시드는 local·e2e, 운영 시연 데이터는 prod에서만 더한다.
    locations: classpath:db/migration
  jackson:
    # 요청 본문의 숫자 필드는 JSON 숫자 그대로만 받는다(결정 0072). 끄지 않으면 정수 필드(id)에 온 1.5·1e3을 잘라 1·1000으로,
    # 문자열 "1"을 1로 받는다. 정수가 아닌 값은 본문을 읽지 못해 400 INVALID_INPUT이다(spec 3, 3.1).
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
management:
  endpoint:
    health:
      # spec 6.10: 응답을 {"status":"UP"}로 둔다. Boot 4는 liveness·readiness 그룹을 기본으로 켜서 "groups"가 붙는다.
      probes:
        enabled: false

---
# local: 로컬 개발. 루트 compose.yaml의 db 서비스(개발 DB)에 붙는다. 접속 정보는 개발 전용 값이다(실제 비밀번호가 아님).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/curtaincall
    username: curtaincall
    password: curtaincall-dev

---
# local·e2e: 시드를 넣는다. e2e는 여기에 E2E 지원 엔드포인트(초기화)가 켜진다.
# e2e는 DB 주소를 정하지 않는다. E2E 백엔드는 ./gradlew bootE2eRun이 실행마다 새로 띄운 임시 DB에 붙는다(결정 0161, 0162).
# 개발 DB 주소를 두면 e2e로 띄운 서버의 초기화가 개발 데이터를 지울 수 있다.
spring:
  config:
    activate:
      on-profile: local | e2e
  flyway:
    locations: classpath:db/migration, classpath:db/seed
    # 시드(V1000__~)와 스키마 마이그레이션이 같은 이력을 쓰고, compose 볼륨이 이력을 유지한다.
    # 시드가 적용된 뒤 추가된 V2 같은 마이그레이션도 적용하도록 순서를 따지지 않는다(끄면 검증 실패로 앱이 뜨지 않는다).
    out-of-order: true

---
# local·e2e·test의 JWT 서명 키. 개발 전용 값이다(실제 비밀값이 아님). prod는 아래 prod 문서에서 JWT_SECRET으로만 받는다.
spring:
  config:
    activate:
      on-profile: local | e2e | test
curtaincall:
  jwt:
    secret: curtain-call-dev-only-jwt-signing-key-do-not-use-in-prod

---
# test: 통합 테스트. DB는 Testcontainers가 @ServiceConnection으로 연결하고, 시드를 넣지 않는다.
spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration

---
# prod: 배포용. DB 접속 정보와 JWT 서명 키는 환경변수로만 받는다(이름은 루트 .env.example). 기본값을 두지 않는다.
# JWT_SECRET이 없으면 값을 정할 수 없고, 32바이트보다 짧으면 JwtConfig가 실패해 애플리케이션이 시작되지 않는다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 스키마 마이그레이션과 운영 시연 데이터(시연 계정 demo1~demo5, 공연장·배치. Issue #71, 결정 0211·0213).
    # local·e2e 시드(db/seed: E2E 계정, 공연)는 쓰지 않는다. 시연 데이터는 반복 마이그레이션(R__)이라 버전 순서에 끼지 않으므로,
    # out-of-order를 끈 채로 나중에 더한 스키마 마이그레이션(V6 등)도 초기화하지 않는 운영 DB에 그대로 적용된다.
    locations: classpath:db/migration, classpath:db/demo
curtaincall:
  jwt:
    secret: ${JWT_SECRET}
